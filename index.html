<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BE6C3A">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="صُب">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>صُب</title>
<style>[hidden]{display:none!important}html,body{margin:0}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* التخطيط: شريط أقسام علوي ثابت، ثم عمود واحد بعرض مريح؛ بطاقات الأرقام في الأعلى والقوائم تحتها */
:root{
  --bg:#FAF4EC; --surface:#FFFDF9; --ink:#2A1A10; --muted:#7A6556; --line:#EADBCB;
  --accent:#B85E2B; --accent-ink:#FFF7EE; --accent-soft:#F6E3D3;
  --warn:#9A6A00; --warn-soft:#FBF1D8; --bad:#B3261E; --bad-soft:#FBE4E2; --good:#1E7A47; --good-soft:#E2F3E8;
  --display:'Reem Kufi','IBM Plex Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1A120D; --surface:#241913; --ink:#F3E6D8; --muted:#B39C8A; --line:#3A2A20;
  --accent:#E08A52; --accent-ink:#1A0F08; --accent-soft:#3A2416;
  --warn:#E2B54A; --warn-soft:#2E2610; --bad:#F08A80; --bad-soft:#3A1A17; --good:#6CCB95; --good-soft:#15301F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1A120D; --surface:#241913; --ink:#F3E6D8; --muted:#B39C8A; --line:#3A2A20;
  --accent:#E08A52; --accent-ink:#1A0F08; --accent-soft:#3A2416;
  --warn:#E2B54A; --warn-soft:#2E2610; --bad:#F08A80; --bad-soft:#3A1A17; --good:#6CCB95; --good-soft:#15301F; color-scheme:dark}
*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65;margin:0}
a{color:var(--accent);font-weight:600}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.brandbar{background:#BE6C3A;color:#FBF1E4}
.brand{display:flex;align-items:center;gap:14px;padding:8px 16px;max-width:980px;margin:0 auto}
.brand img{display:block;height:48px;width:auto}
.brandbar .who,.brandbar #tagline{color:#FBF1E4;opacity:.92}
nav.tabs{padding-top:8px!important}
.brand h1{font-family:var(--display);font-size:30px;margin:0;line-height:1;color:var(--accent)}
.brand p{margin:0;color:var(--muted);font-size:13px}
.brand .who{margin-inline-start:auto;font-size:12px;color:#FBF1E4;opacity:.85;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px 12px 8px;max-width:980px;margin:0 auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
nav.tabs a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav.tabs a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding-block:18px 60px;padding-inline:16px;display:grid;gap:22px}
h2{font-family:var(--display);font-weight:700;font-size:21px;margin:0 0 4px;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px}
.sub{color:var(--muted);font-size:13px;margin:0 0 10px}
section{min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:2px;min-width:0}
.tile b{font-size:21px;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:12.5px}
.tile.good{border-color:var(--good)} .tile.warn{border-color:var(--warn)} .tile.bad{border-color:var(--bad)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
tr:last-child td{border-bottom:none}
.tag{display:inline-block;padding:1px 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.good{background:var(--good-soft);color:var(--good)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.mut{background:var(--accent-soft);color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:end}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
label.f{display:grid;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
input[type=number],input[type=date],input[inputmode]{font-variant-numeric:tabular-nums;text-align:left}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
textarea{min-height:60px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 14px;font-weight:600}
button.soft{background:transparent;color:var(--accent)}
button.ghost{background:transparent;border-color:var(--line);color:var(--muted);padding:3px 9px;font-size:12.5px;font-weight:500}
button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
button[disabled]{opacity:.5;cursor:not-allowed}
.note{border-inline-start:3px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:8px;font-size:14px}
.note.warn{border-color:var(--warn);background:var(--warn-soft)} .note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note b{display:block;margin-bottom:2px}
.list{display:grid;gap:8px}
.item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;gap:6px;min-width:0}
.item .hd{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.item .hd .t{flex:1;min-width:160px;font-weight:600}
.item small{color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{flex:none;margin-top:3px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.grp{font-family:var(--display);font-size:15px;color:var(--accent);margin:14px 0 4px}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}
.banner{max-width:980px;margin:10px auto 0;padding-inline:16px}
.feed{display:grid;gap:4px;font-size:13.5px}
.feed div{display:flex;gap:8px;border-bottom:1px solid var(--line);padding-block:5px}
.feed time{color:var(--muted);white-space:nowrap;font-size:12px}
.pill-on{color:var(--good);font-weight:600}
a.btn-link{display:inline-block;padding:7px 14px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;white-space:nowrap}
.ebar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--surface)}
.ebar.on{border-color:var(--accent);background:var(--accent-soft)}
input:disabled,select:disabled,textarea:disabled{opacity:1;color:var(--ink);background:transparent;border-color:transparent;cursor:default}
.tl-strip{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin-top:10px}
.tl-seg{position:relative;height:30px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--ink);font-weight:600;font-size:13px}
.tl-seg i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--accent);opacity:.35}
.tl-seg.done i{opacity:1}.tl-seg.done{color:var(--accent-ink)}
.tl-seg.now{outline:2px solid var(--accent);outline-offset:1px}
.tl-seg span{position:relative}
.tl-strip.sm .tl-seg{height:22px;font-size:11px}
.tl-cap{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13.5px}
ol.tl{list-style:none;margin:0;padding:0;display:grid;gap:10px;position:relative}
ol.tl::before{content:"";position:absolute;inset-block:14px;inset-inline-start:15px;width:2px;background:var(--line)}
.tl-ph{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;position:relative}
.tl-dot{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:14px;z-index:1}
.tl-ph.done .tl-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl-ph.now .tl-dot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.tl-ph.now .item{border-color:var(--accent)}
.tl-hd{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;font-weight:600}
.tl-hd:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
details summary{cursor:pointer;color:var(--accent);font-weight:600}
@media (max-width:560px){.brand h1{font-size:26px}.tile b{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.upl{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13.5px;cursor:pointer;background:var(--surface)}
.upl input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.atts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.att-w{position:relative}
.att-b{padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);cursor:pointer;overflow:hidden;opacity:1}
.att-b .th{display:flex;align-items:center;justify-content:center;width:72px;height:72px;font-size:22px}
.att-b .th img{width:100%;height:100%;object-fit:cover}
.att-b .th.tx{width:auto;min-width:72px;max-width:180px;padding:0 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-x{position:absolute;top:-6px;left:-6px;width:22px;height:22px;border-radius:50%;padding:0;font-size:12px;background:var(--bad);color:#fff;border:none;cursor:pointer}
#viewer{position:fixed;inset:0;z-index:60;background:rgba(20,12,6,.92);display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#viewer .vw-bar{display:flex;gap:8px;align-items:center;padding:10px 12px;background:var(--bg)}
#viewer .vw-bar .ghost{text-decoration:none}
#viewer .vw-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;overflow:auto;color:#fff}
#viewer img,#viewer video{max-width:100%;max-height:100%;border-radius:8px}
#viewer iframe{width:100%;flex:1;min-height:60vh;border:0;background:#fff;border-radius:8px}
input[data-ing="name"]{min-width:150px}select[data-mr]{min-width:140px}select[data-ing="unit"]{min-width:120px}
.dwrap{position:relative;display:flex;align-items:center;min-height:38px;margin-top:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:7px 9px;width:100%;box-sizing:border-box;cursor:pointer}
.dwrap input[type=date]{position:absolute;inset:0;width:100%;height:100%;opacity:0;margin:0;cursor:pointer;border:0;padding:0}
.dwrap.dis{opacity:.75;cursor:default}.dwrap .dlab{pointer-events:none}
.dwrap::after{content:"📅";position:absolute;left:9px;font-size:14px;pointer-events:none}
bdi.dt{white-space:nowrap}
.ac-w{position:relative;display:inline-block}
.ac{display:flex;flex-direction:column;width:112px;padding:0;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;overflow:hidden;text-align:right;box-shadow:0 1px 2px rgba(42,26,16,.06);transition:transform .12s,box-shadow .12s}
.ac:hover,.ac:focus-visible{transform:translateY(-1px);box-shadow:0 4px 12px rgba(42,26,16,.12)}
.ac-prev{display:flex;align-items:center;justify-content:center;width:100%;height:84px;background:var(--accent-soft);overflow:hidden}
.ac-prev img{width:100%;height:100%;object-fit:cover}
.ac-ic{display:flex;align-items:center;justify-content:center;width:46px;height:56px;border-radius:6px;font-weight:700;font-size:13px;color:#fff;background:#8A7A6E;letter-spacing:.5px}
.ac-ic.ic-img{background:none;font-size:30px;width:auto}
.ac-ic.ic-pdf{background:#C8382E}.ac-ic.ic-xls{background:#1E7A47}.ac-ic.ic-doc{background:#2B5DB8}.ac-ic.ic-img2{background:#7A5AB8;font-size:11px}
.ac-ic.ic-vid{background:rgba(42,26,16,.75);width:44px;height:44px;border-radius:50%;font-size:18px}
.ac-cap{display:flex;flex-direction:column;gap:1px;padding:6px 8px}
.ac-name{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-meta{font-size:11px;color:var(--muted)}
.offb{max-width:980px;margin:0 auto 6px;padding:6px 12px;border-radius:999px;background:var(--warn-soft);color:var(--warn);font-size:13px;text-align:center}
/* تجاوب مع كل الشاشات */
html,body{overflow-x:hidden;max-width:100%}
.item>*,details.item>*{min-width:0}
details.item{display:block;max-width:100%}details.item>*{max-width:100%;margin-top:6px}details.item .fgrid{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))}
.tw{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
img,video,iframe{max-width:100%}
.rhow ol{margin:6px 0 0;padding-inline-start:20px;display:grid;gap:6px;font-size:14px;line-height:1.7}
.rpp{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}.rpp li{display:grid;grid-template-columns:minmax(80px,auto) 1fr auto;gap:8px;align-items:center;font-size:13.5px}.rpp .bar{height:6px}
.rstat,.rfil{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.rfil button{padding:5px 12px;font-size:13px}
.rcard{gap:8px;padding:14px}.rcard.r-all{border-color:var(--good)}.rcard.r-ed{border-color:var(--bad)}
.rtop{display:flex;justify-content:space-between;align-items:center;gap:8px}.rno{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px}
.rt{margin:0;font-size:16px;line-height:1.5;overflow-wrap:anywhere}.rx{margin:0;line-height:1.75;overflow-wrap:anywhere}
.rwhy{margin:0;font-size:13.5px;color:var(--muted);background:var(--warn-soft);border-radius:8px;padding:7px 10px;line-height:1.7}
.ragreed{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;display:grid;gap:4px}.ragreed textarea{width:100%;resize:vertical;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface)}.ragreed textarea:disabled{border-color:transparent;padding:0;resize:none;opacity:1;color:var(--ink,inherit)}.ragreed:has(textarea:disabled:placeholder-shown){display:none}
.rpl{list-style:none;margin:0;padding:0;display:grid;gap:4px;border-top:1px solid var(--line);padding-top:8px}
.rpl li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:13.5px}.rpl .ps{font-weight:600}.rpl li.ok .ps{color:var(--good)}.rpl li.edit .ps{color:var(--bad)}.rpl li.wait .ps{color:var(--muted)}
.rpl q{flex-basis:100%;quotes:none;background:var(--bad-soft);border-radius:8px;padding:6px 10px;font-size:13.5px;overflow-wrap:anywhere}
.rvote{display:grid;grid-template-columns:1fr 1fr;gap:8px}.rvote button{min-height:44px;font-size:15px}
.rvote button.on.ok{background:var(--good);border-color:var(--good);color:#fff}.rvote button.on.ed{background:var(--bad);border-color:var(--bad);color:#fff}
.redit{display:grid;gap:8px}.redit textarea{width:100%}.rhint{color:var(--warn)}
.signc .sgrid,.fsig{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(200px,100%),1fr));gap:10px;margin:8px 0}
.sbox{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:grid;gap:4px;background:var(--surface)}.sbox.ok{border-color:var(--good)}.sbox small{color:var(--muted)}
.sigimg{width:100%;height:auto;max-height:90px;display:block;background:#fff;border-radius:6px}.snone{color:var(--muted);font-size:13px;padding:14px 0}
.spad{display:grid;gap:8px}.hpad{border:2px solid var(--accent);border-radius:12px;padding:12px;margin:10px 0;background:var(--accent-soft)}#sigCv,#hsigCv{width:100%;touch-action:none;background:#fff;border:2px dashed var(--accent);border-radius:10px;display:block;cursor:crosshair}.sline{border-top:1px solid var(--muted);text-align:center;font-size:13px;color:var(--muted);padding-top:4px}
.fcon{border:2px solid var(--good)}.fcon h3{margin:14px 0 6px}.fct{text-align:center;margin:12px 0 2px}.fcd{text-align:center;color:var(--muted);margin:0}.fcl li{margin-bottom:6px;line-height:1.75}.fsig>div{text-align:center;border-top:1px solid var(--line);padding-top:8px}.fsn{font-weight:700}.fsd{font-size:13px;color:var(--muted)}
.waitv{min-height:calc(100vh - 230px);display:flex;align-items:center;justify-content:center;text-align:center}.wv-in{display:grid;gap:10px;justify-items:center;max-width:560px;width:100%}.wv-ic{font-size:44px}
.cd{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap;direction:rtl;width:100%}.cdu{background:var(--surface);border:1px solid var(--line);border-radius:14px;flex:1 1 0;max-width:110px;min-width:0;padding:10px 4px;display:grid}.cdu b{font-size:clamp(28px,9vw,44px);line-height:1.1;color:var(--accent)}.cdu span{font-size:12.5px;color:var(--muted)}.cd.up .cdu b{color:var(--good)}
.cdl{font-weight:600}.wv-dua{font-size:clamp(22px,6vw,30px);font-weight:800;color:var(--accent);margin:8px 0}
@media print{body *{visibility:hidden}#contractDoc,#contractDoc *{visibility:visible}#contractDoc{position:absolute;inset:0;border:0}.noprint{display:none!important}}
.clk{display:inline-grid;grid-template-columns:auto;justify-items:center;line-height:1.15;padding:3px 10px;border-radius:12px;background:rgba(251,241,228,.14);border:1px solid rgba(251,241,228,.35);color:#FBF1E4;white-space:nowrap;margin-inline-start:8px;font-variant-numeric:tabular-nums}
.clk .ct{font-size:14px;font-weight:700;letter-spacing:.3px}.clk .ct i{font-style:normal;animation:clkb 1s steps(1) infinite}@keyframes clkb{50%{opacity:.25}}
.clk small{font-size:10.5px;opacity:.9}.clk .cd2::before{content:' · '}
@media (max-width:640px){#tagline{display:none}.clk .cd2{display:none}}
@media (max-width:420px){.clk{margin-inline-start:auto;padding:2px 8px}}
@media (max-width:420px){#tagline,.brand .who{display:none}.brand{gap:8px;padding:8px 10px}.brand img{height:40px}.brand button{padding:4px 9px}}
@media (min-width:1100px){main,.tabs,.brand{max-width:1080px}}
/* الدردشة */
.chat-list{display:flex;flex-direction:column;gap:10px;padding-bottom:12px}
.msg{max-width:84%;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px 12px;overflow-wrap:anywhere}
.msg.mine{align-self:flex-end;background:var(--accent-soft);border-color:transparent}
.msg .mh{display:flex;gap:8px;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:2px}
.msg .mt{white-space:pre-wrap;line-height:1.6}
.msg a{color:var(--accent-ink);text-decoration:underline}
.msg .att{margin-top:6px;border-radius:10px;overflow:hidden;background:var(--line);min-height:60px;display:flex;align-items:center;justify-content:center}
.msg .att img,.msg .att video{display:block;max-width:100%;max-height:360px}
.msg .att button{margin:12px}
.msg .yt{display:block;margin-top:6px;border-radius:10px;overflow:hidden;position:relative}
.msg .yt img{display:block;width:100%}
.msg .yt span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.chat-day{align-self:center;font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:flex-end;border-top:1px solid var(--line)}
.composer textarea{flex:1;min-height:44px;max-height:140px;resize:none;border-radius:22px;padding:10px 14px}
.composer label,.composer button{flex:none;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;padding:0}
.composer label{background:var(--surface);border:1px solid var(--line)}
.composer input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.msg .del{background:none;border:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:13px}
/* الهوية البصرية */
.bchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.bchip{background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:6px 12px;font-weight:500;font-size:13.5px}
.bchip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bwrap{display:grid;gap:14px;margin-top:12px}
.bgrid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;align-items:start}
.bgrid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-bottom:10px}
.bfig{margin:0;min-width:0}.bfig img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--line);background:var(--line)}
.bfig figcaption{font-size:12px;color:var(--muted);margin-top:4px}
.bsrc{display:block;color:var(--muted);font-size:11.5px;margin-top:6px}
.bdls{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:8px}
a.bdl{display:grid;gap:2px;border:1px solid var(--line);border-radius:8px;padding:9px 12px;text-decoration:none;color:var(--ink);background:var(--bg);min-width:0}
a.bdl b{color:var(--accent)}a.bdl small{color:var(--muted);font-size:12px}
.bsw{display:inline-block;width:14px;height:14px;border-radius:4px;border:1px solid var(--line);vertical-align:-2px;margin-inline-end:6px}
.bul{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:3px}.bol{margin:6px 0 0;padding-inline-start:20px;display:grid;gap:3px}
.bwrap .panel p{margin:6px 0}
</style>

function padInit(cid,SIG){const cv=document.getElementById(cid);if(!cv)return;const W=cv.clientWidth||300,H=Math.round(W/3);const dpr=window.devicePixelRatio||1;cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+'px';const x=cv.getContext('2d');x.scale(dpr,dpr);x.lineWidth=2.6;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#1d1b18';
  const draw=()=>{x.clearRect(0,0,W,H);SIG.strokes.forEach(s=>{x.beginPath();s.forEach((pt,i)=>{const a=pt[0]*W/600,b=pt[1]*H/200;i?x.lineTo(a,b):x.moveTo(a,b);});if(s.length===1)x.lineTo(s[0][0]*W/600+.1,s[0][1]*H/200);x.stroke();});};draw();
  const pos=e=>{const r=cv.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*600),Math.round((e.clientY-r.top)/r.height*200)];};

  cv.onpointermove=e=>{if(!SIG.cur)return;e.preventDefault();const p=pos(e),l=SIG.cur[SIG.cur.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])<3)return;SIG.cur.push(p);draw();};

  const cap=v('capital');const rev=v('ticket')/1.15*v('orders')*v('days');const gp=rev*(1-v('cogs')/100);const fixed=v('rent')+v('staff')+v('other');const net=gp-fixed;

  h+=`<div class="note"><b>اقرأوها هكذا</b>«طلبات التعادل» أهم رقم: أقل عدد طلبات يوميًّا لا تخسرون عنده. إن كان قريبًا من توقعكم فالمشروع حساس لأي شهر ضعيف، فخففوا المصاريف الثابتة قبل الافتتاح. الأرقام تقديرات للتخطيط، لا وعد بربح.</div>`;return h;}

const tlS=()=>(st.tl&&st.tl.m)||{};
function msDone(m){const s=tlS()[m[0]];if(s&&s.done!=null)return !!s.done;return m[2]?!!m[2]():false;}
function phStat(ph){const ms=ph[3];const d=ms.filter(msDone).length;let pct=d/ms.length;if(ph[4]){const sp=secPct(ph[4]);pct=(pct+sp)/2;}return {d,n:ms.length,pct:Math.round(pct*100)};}
let tlOpen=null;
function curPhase(){const i=PH.findIndex(ph=>phStat(ph).pct<100);return i<0?PH.length-1:i;}
function tlStrip(small){const ci=curPhase();const all=Math.round(sum(PH,ph=>phStat(ph).pct)/PH.length);
  return `<div class="tl-strip${small?' sm':''}" role="img" aria-label="التقدم الكلي ${all}٪، المرحلة الحالية ${PH[ci][1]}">${PH.map((ph,i)=>{const s=phStat(ph);return `<a href="#tl" data-tlgo="${ph[0]}" class="tl-seg ${s.pct>=100?'done':i===ci?'now':''}" title="${esc(ph[1])} ${s.pct}٪"><i style="width:${s.pct}%"></i><span>${i+1}</span></a>`;}).join('')}</div>
   <div class="tl-cap"><span>أنتم في المرحلة <b>${ci+1}</b>: ${esc(PH[ci][1])}</span><span class="num">${all}٪</span></div>`;}

  let days='';if(c.open){const d=Math.ceil((new Date(c.open)-new Date(today_))/864e5);days=d>=0?`<b class="num">${d}</b> يومًا على الافتتاح (${fmtD(c.open)})`:'موعد الافتتاح مضى';}
  let h=`<section><h2>الجدول الزمني</h2><p class="sub">ثماني مراحل من السجل إلى الافتتاح. بعض المعالم تُحسب تلقائيًّا من الملف (بنود الميزانية والموظفين والمنيو ورأس المال)، والباقي يعلّمه الشركاء. حدّدوا لكل معلم موعدًا مستهدفًا ليظهر المتأخر.</p>${tlStrip(false)}<p class="sub" style="margin-top:6px">${days||'حدّدوا موعد الافتتاح المستهدف في «الشركاء ورأس المال».'}</p></section><ol class="tl">`;
  PH.forEach((ph,i)=>{const s=phStat(ph);const isNow=i===ci;const open=tlOpen?tlOpen===ph[0]:isNow;const late=ph[3].filter(m=>!msDone(m)&&ms[m[0]]&&ms[m[0]].date&&ms[m[0]].date<today_).length;
   h+=`<li class="tl-ph ${s.pct>=100?'done':isNow?'now':'next'}"><span class="tl-dot" aria-hidden="true">${s.pct>=100?'✓':i+1}</span><div class="item"><button class="tl-hd" data-tlopen="${ph[0]}" aria-expanded="${open}"><span class="t">${esc(ph[1])}${isNow?' <span class="tag warn">أنتم هنا</span>':''}${late?` <span class="tag bad">${late} متأخر</span>`:''}</span><span class="num">${s.pct}٪</span></button>${ph[2]?`<small>${esc(ph[2])}</small>`:''}<div class="bar"><i style="width:${s.pct}%"></i></div>
   ${open?`<div class="list" style="margin-top:8px">${ph[3].map(m=>{const sv=ms[m[0]]||{};const dn=msDone(m);const auto=!!m[2]&&sv.done==null;const dt=sv.date||m[3]||'';const lt=!dn&&dt&&dt<today_;
     return `<div class="chk"><input type="checkbox" id="tm_${m[0]}" data-tlm="${m[0]}"${dn?' checked':''}${m[0]==='cr'?' disabled':''} aria-label="${esc(m[1])}"><div style="flex:1;min-width:0"><span style="${dn?'text-decoration:line-through;color:var(--muted)':''}">${esc(m[1])}</span>${auto?' <small class="sub">(تلقائي من الملف)</small>':''}${lt?' '+tag('متأخر','bad'):''}${sv.by?` <small class="sub">— ${esc(who(sv.by))}</small>`:''}</div><input type="date" id="td_${m[0]}" data-tld="${m[0]}" value="${esc(dt)}" style="width:150px" aria-label="الموعد المستهدف"></div>`;}).join('')}${ph[4]?`<p class="sub" style="margin:6px 0 0">بنود الميزانية في هذه المرحلة: ${Math.round(secPct(ph[4])*100)}٪ منتهية. <a href="#site">افتح بنود التأسيس</a></p>`:''}</div>`:''}</div></li>`;});

function fsize(n){n=+n||0;if(!n)return '';return n<1024*1024?Math.max(1,Math.round(n/1024))+' KB':(n/1048576).toFixed(1)+' MB';}
function ftype(a){const n=(a.name||'').toLowerCase(),m=(a.mime||'').toLowerCase();if(a.k==='img')return ['صورة','img'];if(a.k==='vid')return ['فيديو','vid'];
  if(/pdf/.test(m)||/\.pdf$/.test(n))return ['PDF','pdf'];if(/\.(xlsx?|csv)$/.test(n)||/sheet|excel/.test(m))return ['Excel','xls'];if(/\.(docx?)$/.test(n)||/word/.test(m))return ['Word','doc'];if(/\.(heic|heif)$/.test(n))return ['صورة HEIC','img2'];return ['ملف','gen'];}
function attStrip(att,editId){att=att||[];if(!att.length)return '';
  return `<div class="atts">${att.map((a,i)=>{const [tl,tc]=ftype(a);const ic={vid:'▶',pdf:'PDF',xls:'XLS',doc:'DOC',img2:'HEIC',gen:'📎'}[tc]||'📎';
    const prev=a.k==='img'?`<span class="ac-prev" data-th="${esc(a.id)}">${MEDIA[a.id]?`<img src="${MEDIA[a.id]}" alt="">`:'<span class="ac-ic ic-img">🖼️</span>'}</span>`:`<span class="ac-prev"><span class="ac-ic ic-${tc}">${ic}</span></span>`;
    return `<span class="ac-w"><button class="ac" data-view="${esc(a.id)}" data-k="${esc(a.k)}" data-name="${esc(a.name||'')}" aria-label="عرض ${esc(a.name||tl)}">${prev}<span class="ac-cap"><span class="ac-name">${esc(a.name||tl)}</span><span class="ac-meta">${tl}${a.size?' · '+fsize(a.size):''}</span></span></button>${editId?`<button class="att-x" data-satdel="${editId}|${i}" aria-label="حذف المرفق">✕</button>`:''}</span>`;}).join('')}</div>`;}

function hydrateThumbs(){document.querySelectorAll('[data-th]').forEach(el=>{const id=el.dataset.th;if(MEDIA[id]){if(!el.querySelector('img'))el.innerHTML=`<img src="${MEDIA[id]}" alt="مرفق">`;return;}

async function upOne(f){const isImg=/^image\//.test(f.type)&&!/heic|heif/i.test(f.type),isVid=/^video\//.test(f.type);if(f.size>25*1024*1024)throw new Error('«'+f.name+'» أكبر من 25 ميجا');const blob=isImg?await shrink(f):f;
  const name=isImg?(f.name||'photo').replace(/\.\w+$/,'')+'.jpg':(f.name||'file');const r=await window.subUpload(blob,name,isImg?'image/jpeg':(f.type||'application/octet-stream'));MEDIA[r.id]=URL.createObjectURL(blob);return {k:isImg?'img':isVid?'vid':'file',id:r.id,name,mime:isImg?'image/jpeg':(f.type||''),size:blob.size||f.size||0};}

  if(user){try{myId=await user.id();}catch(e){}}
  if(!db){render();return;}
  const err=e=>flash('تعذّر تحميل جزء من البيانات: '+((e&&e.message)||''),'bad');
  db.doc('cfg/main').onSnapshot(s=>{st.cfg=s.exists?s.data():null;CONTRACT=(st.cfg&&st.cfg.contractUrl)||'';resolveNames();schedule();},err);
  db.collection('profiles').onSnapshot(q=>{const o={};q.docs.forEach(x=>{o[x.id]=x.data();});st.profiles=o;schedule();},err);
  db.doc('holder/main').onSnapshot(s=>{st.holder=s.exists?s.data():null;schedule();},err);
  db.doc('holder/sign').onSnapshot(s=>{st.hsign=s.exists&&s.data().d?s.data():null;schedule();},err);
  db.doc('tl/main').onSnapshot(s=>{st.tl=s.exists?s.data():null;schedule();},err);
  db.doc('budget/main').onSnapshot(s=>{st.bud=s.exists?s.data():null;schedule();},err);
  db.doc('calc/main').onSnapshot(s=>{st.calc=s.exists?s.data():null;schedule();},err);
  const col=(name,key)=>db.collection(name).onSnapshot(q=>{st[key]=q.docs.map(x=>Object.assign({id:x.id},x.data()));resolveNames();schedule();},err);
  col('items','items');col('ings','ings');col('menu','menu');col('staff','staff');col('spend','spend');col('contrib','contrib');col('tasks','tasks');col('dec','dec');col('chat','chat');col('trash','trash');col('dist','dist');
  db.collection('sign').onSnapshot(q=>{const o={};q.docs.forEach(x=>{o[x.id]=x.data();});st.sign=o;schedule();},err);
  db.collection('log').orderBy('ts','desc').limit(300).onSnapshot(q=>{st.log=q.docs.map(x=>Object.assign({id:x.id},x.data()));resolveNames();schedule();},err);
  db.collection('chk').onSnapshot(q=>{const o={};q.docs.forEach(x=>{o[x.id]=x.data();});st.chk=o;schedule();},err);
})();
let nameT;function resolveNames(){if(!user)return;clearTimeout(nameT);nameT=setTimeout(async()=>{const ids=new Set();[st.items,st.spend,st.contrib,st.tasks,st.dec,st.log].forEach(L=>L.forEach(x=>{if(x.by)ids.add(x.by);if(x.doneBy)ids.add(x.doneBy);}));P().forEach(p=>{if(p.uid)ids.add(p.uid);});
  const list=[...ids].filter(Boolean);if(!list.length)return;try{const ps=await user.profiles(list);let ch=false;list.forEach(id=>{const n=(ps[id]&&ps[id].name)||'';if(n&&names[id]!==n){names[id]=n;ch=true;}});if(ch)schedule();}catch(e){}},150);}
})();
</script>
